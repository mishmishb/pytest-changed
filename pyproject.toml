[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[project]
name = "pytest-changed"
dynamic = ["version"]
description = "Run only the pytest tests mapped to staged source files. Explicit mapping, no heuristics."
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.11"
authors = [
    {name = "mishmishb"},
]
keywords = ["pytest", "pre-commit", "testing", "ci", "developer-tools"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Testing",
    "Topic :: Utilities",
]

dependencies = [
    "pytest>=8.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov",
    "ruff",
    "bandit",
    "pip-audit",
    "pyright",
]

[project.scripts]
pytest-changed = "pytest_changed.cli:main"

[tool.ruff]
line-length = 99
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B", "SIM"]
ignore = ["E501", "E402", "SIM102", "SIM105", "SIM108"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-v --tb=short"

[tool.bandit]
exclude_dirs = ["tests"]
skips = ["B101", "B310"]

[tool.pyright]
typeCheckingMode = "standard"
include = ["src"]
exclude = ["tests/**", ".venv/**"]

[tool.hatch.version]
source = "vcs"

[tool.hatch.build.hooks.vcs]
version-file = "src/pytest_changed/_version.py"

[tool.pytest-changed]
pytest_args = ["-q"]

[tool.pytest-changed.mapping]
# Add your source→test mappings here. Example:
# "src/my_module.py" = ["tests/test_my_module.py"]
# "src/utils/helpers.py" = ["tests/utils/test_helpers.py"]
